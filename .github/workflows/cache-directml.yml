name: Cache DirectML runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    name: Rebuild and refresh cache
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve DirectML cache key
        id: directml
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .github/directml-sherpa-version)"
          echo "key=directml-sherpa-${version}" >> "$GITHUB_OUTPUT"

      - name: Delete existing cache entry
        uses: actions/github-script@v7
        env:
          CACHE_KEY: ${{ steps.directml.outputs.key }}
        with:
          script: |
            const key = process.env.CACHE_KEY;
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                key,
                per_page: 100,
                page,
              });
              if (data.actions_caches.length === 0) break;
              for (const cache of data.actions_caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              }
            }

      - uses: actions/cache@v4
        with:
          path: native/win-x64/directml
          key: ${{ steps.directml.outputs.key }}

      - name: Build DirectML runtime
        shell: pwsh
        run: ./scripts/fetch-directml-runtime.ps1 -Build

      - name: Verify DirectML runtime
        shell: pwsh
        run: |
          $files = @('sherpa-onnx-c-api.dll', 'onnxruntime.dll', 'DirectML.dll')
          foreach ($f in $files) {
            if (-not (Test-Path "native/win-x64/directml/$f")) {
              throw "Missing DirectML runtime file: $f"
            }
          }
