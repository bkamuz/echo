name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build all platforms
    runs-on: [self-hosted, Linux, aeza-personal]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            version="$(dotnet msbuild src/Echo.App/Echo.App.csproj -nologo -getProperty:Version | tr -d '[:space:]')"
            echo "VERSION=${version}" >> "$GITHUB_ENV"
          fi

      - name: Resolve DirectML cache key
        id: directml
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .github/directml-sherpa-version)"
          echo "key=directml-sherpa-${version}" >> "$GITHUB_OUTPUT"

      - name: Restore DirectML runtime cache
        uses: actions/cache@v6
        id: directml-cache
        with:
          path: native/win-x64/directml
          key: ${{ steps.directml.outputs.key }}
          restore-keys: |
            directml-sherpa-

      - name: Download DirectML runtime if missing
        if: steps.directml-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < .github/directml-sherpa-version)"
          dest="native/win-x64/directml"
          mkdir -p "$dest"
          if ! ls "$dest"/*.dll >/dev/null 2>&1; then
            gh release download "directml-runtime-${version}" \
              --repo "${{ github.repository }}" \
              --dir "$dest" \
              --clobber
          fi

      - name: Verify DirectML runtime
        shell: bash
        run: |
          for f in sherpa-onnx-c-api.dll onnxruntime.dll DirectML.dll; do
            if [[ ! -f "native/win-x64/directml/$f" ]]; then
              echo "Missing DirectML runtime file: $f" >&2
              echo "Run Seed DirectML cache or upload directml-runtime-<version> release." >&2
              exit 1
            fi
          done

      - name: Publish all portable archives
        shell: bash
        run: |
          chmod +x build/publish.sh build/portable.sh build/portable-all.sh build/linux-packages.sh build/linux/*.sh
          ./build/portable-all.sh "$VERSION"

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: echo-win-x64
          path: dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: echo-linux-x64
          path: |
            dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.deb
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.AppImage
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.flatpak
          if-no-files-found: warn

      - name: Upload osx-arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: echo-osx-arm64
          path: dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: [self-hosted, Linux, aeza-personal]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: dist/releases
          pattern: echo-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
            dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.deb
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.AppImage
            dist/releases/Echo-${{ env.VERSION }}-linux-x64.flatpak
            dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz

      - name: Publish public update channel
        env:
          GH_TOKEN: ${{ secrets.ECHO_UPDATES_TOKEN }}
          VERSION: ${{ env.VERSION }}
          UPDATES_REPO: bkamuz/echo-updates
        run: |
          chmod +x scripts/publish-update-channel.sh
          ./scripts/publish-update-channel.sh "dist/releases/Echo-${VERSION}-win-x64-portable.zip"
