name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build all platforms
    runs-on: [self-hosted, Linux, aeza-personal]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            version="$(dotnet msbuild src/Echo.App/Echo.App.csproj -nologo -getProperty:Version | tr -d '[:space:]')"
            echo "VERSION=${version}" >> "$GITHUB_ENV"
          fi

      - name: Resolve DirectML cache key
        id: directml
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .github/directml-sherpa-version)"
          echo "key=directml-sherpa-${version}" >> "$GITHUB_OUTPUT"

      - name: Restore DirectML runtime cache
        uses: actions/cache@v4
        id: directml-cache
        with:
          path: native/win-x64/directml
          key: ${{ steps.directml.outputs.key }}
          restore-keys: |
            directml-sherpa-

      - name: Verify DirectML runtime
        shell: bash
        run: |
          if [[ "${{ steps.directml-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "DirectML cache miss. Seed the cache first (Seed DirectML cache workflow)." >&2
            echo "See docs/gpu-directml.md" >&2
            exit 1
          fi
          for f in sherpa-onnx-c-api.dll onnxruntime.dll DirectML.dll; do
            if [[ ! -f "native/win-x64/directml/$f" ]]; then
              echo "Missing DirectML runtime file: $f" >&2
              exit 1
            fi
          done

      - name: Publish all portable archives
        shell: bash
        run: |
          chmod +x build/publish.sh build/portable.sh build/portable-all.sh
          ./build/portable-all.sh "$VERSION"

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-win-x64
          path: dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-linux-x64
          path: dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
          if-no-files-found: error

      - name: Upload osx-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-osx-arm64
          path: dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: [self-hosted, Linux, aeza-personal]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          pattern: echo-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
            dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
            dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
