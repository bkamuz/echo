name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build all platforms
    runs-on: [self-hosted, Windows, aeza-personal]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (dotnet msbuild src/Echo.App/Echo.App.csproj -nologo -getProperty:Version).Trim()
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve DirectML cache key
        id: directml
        shell: pwsh
        run: |
          $version = (Get-Content .github/directml-sherpa-version -Raw).Trim()
          "key=directml-sherpa-$version" >> $env:GITHUB_OUTPUT

      - name: Restore DirectML runtime cache
        uses: actions/cache@v4
        id: directml-cache
        with:
          path: native/win-x64/directml
          key: ${{ steps.directml.outputs.key }}
          restore-keys: |
            directml-sherpa-

      - name: Verify DirectML runtime
        shell: pwsh
        run: |
          if ('${{ steps.directml-cache.outputs.cache-hit }}' -ne 'true') {
            throw @"
          DirectML cache miss. Seed the cache first:
            1. Upload DLLs to maintainer release directml-runtime-<version>
            2. Run workflow: Seed DirectML cache
          See docs/gpu-directml.md
          "@
          }
          $files = @('sherpa-onnx-c-api.dll', 'onnxruntime.dll', 'DirectML.dll')
          foreach ($f in $files) {
            if (-not (Test-Path "native/win-x64/directml/$f")) {
              throw "Missing DirectML runtime file: $f"
            }
          }

      - name: Publish all portable archives
        shell: pwsh
        run: ./build/portable-all.ps1 -Version $env:VERSION

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-win-x64
          path: dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-linux-x64
          path: dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
          if-no-files-found: error

      - name: Upload osx-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-osx-arm64
          path: dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: [self-hosted, Windows, aeza-personal]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          pattern: echo-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
            dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
            dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
