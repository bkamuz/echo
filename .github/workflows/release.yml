name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            version="$(dotnet msbuild src/Echo.App/Echo.App.csproj -nologo -getProperty:Version | tr -d '[:space:]')"
            echo "VERSION=${version}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore DirectML runtime cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: directml-cache
        with:
          path: native/win-x64/directml
          key: directml-sherpa-1.13.4
          restore-keys: |
            directml-sherpa-

      - name: Build DirectML runtime if cache miss
        if: runner.os == 'Windows' && steps.directml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-directml-runtime.ps1 -Build

      - name: Verify DirectML runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('sherpa-onnx-c-api.dll', 'onnxruntime.dll', 'DirectML.dll')
          foreach ($f in $files) {
            if (-not (Test-Path "native/win-x64/directml/$f")) {
              throw "Missing DirectML runtime file: $f"
            }
          }

      - name: Publish portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/portable.ps1 -Runtime ${{ matrix.rid }} -Version $env:VERSION

      - name: Publish portable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x build/publish.sh build/portable.sh
          ./build/portable.sh ${{ matrix.rid }} "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.rid }}
          path: dist/releases/Echo-${{ env.VERSION }}-${{ matrix.rid }}-portable.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          pattern: echo-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Echo-${{ env.VERSION }}-win-x64-portable.zip
            dist/releases/Echo-${{ env.VERSION }}-linux-x64-portable.tar.gz
            dist/releases/Echo-${{ env.VERSION }}-osx-arm64-portable.tar.gz
